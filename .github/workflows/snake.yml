name: Generate Snake Animation

on:
  schedule:
    # Run once every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake SVG Matrix
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yaseerayyash20-tech
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00F5FF&color_dots=#080B14,#0D1324,#00F5FF,#9D4EDD,#FF3CAC
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F5FF&color_dots=#080B14,#0D1324,#00F5FF,#9D4EDD,#FF3CAC

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
